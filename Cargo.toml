[package]
name = "badclip"
version = "0.1.0"
edition = "2024"
description = "Extract breakends and structural-variant signals from long-read alignments"
license = "MIT"

[[bin]]
name = "badclip"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"
noodles-sam = "0.87"
noodles-core = "0.20"
noodles-fasta = "0.64"
noodles-util = { version = "0.82", features = ["alignment"] }

[dev-dependencies]
flate2 = "1"
