[package]
name = "badclip"
version = "0.1.0"
edition = "2024"
description = "Extract breakends and structural-variant signals from long-read alignments"
license = "MIT"

[[bin]]
name = "badclip"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
flate2 = "1"

[dev-dependencies]
flate2 = "1"
